<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwen3.5-4B on AMD RDNA2</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3;
          --muted:#8b949e; --accent:#58a6ff; --user:#1f3a5f; --ai:#1c2128; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.5 system-ui, "Segoe UI", sans-serif; height:100vh;
         display:flex; flex-direction:column; }
  header { padding:14px 20px; border-bottom:1px solid var(--border);
           background:var(--panel); display:flex; align-items:center; gap:10px; }
  header b { font-size:16px; }
  header span { color:var(--muted); font-size:13px; }
  #speed { margin-left:auto; color:var(--accent); font-variant-numeric:tabular-nums; }
  #chat { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:820px; padding:12px 16px; border-radius:12px;
         border:1px solid var(--border); white-space:pre-wrap; }
  .msg.user { align-self:flex-end; background:var(--user); }
  .msg.ai { align-self:flex-start; background:var(--ai); width:auto; min-width:200px; }
  .msg .who { font-size:12px; color:var(--muted); margin-bottom:4px; }
  .typing { color:var(--accent); }
  .msg.ai.thinking::before { content:""; display:inline-block; width:12px; height:12px;
         border:2px solid var(--border); border-top-color:var(--accent);
         border-radius:50%; animation:spin .8s linear infinite; margin-right:8px; }
  .msg.ai.thinking::after { content:"Thinking\2026"; color:var(--muted); font-style:italic; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #bar { padding:14px 20px; border-top:1px solid var(--border);
         background:var(--panel); display:flex; gap:10px; }
  textarea { flex:1; background:#0d1117; color:var(--text); border:1px solid var(--border);
             border-radius:10px; padding:12px; font:15px system-ui; resize:none; height:64px; }
  textarea:focus { outline:none; border-color:var(--accent); }
  button { background:var(--accent); color:#fff; border:0; border-radius:10px;
           padding:0 22px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
</style>
</head>
<body>
<header>
  <b id="modelName">Qwen3.5-4B</b>
  <span>AMD RDNA2 native &middot; vLLM server on 127.0.0.1:8000</span>
  <span id="speed">-- tok/s</span>
</header>
<div id="chat">
  <div class="msg ai"><div class="who">Model</div>Hi! I'm running locally on your GPU. Ask me anything.</div>
</div>
<div id="bar">
  <textarea id="input" placeholder="Type a message... (Enter to send, Shift+Enter for newline)"></textarea>
  <button id="send" onclick="send()">Send</button>
</div>
<script>
const API = "http://127.0.0.1:8000/v1/chat/completions";
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const btn = document.getElementById("send");
const speed = document.getElementById("speed");
let history = [];
let modelName = "Qwen3.5-4B";

fetch("http://127.0.0.1:8000/v1/models")
  .then(r => r.json())
  .then(j => {
    if (j.data && j.data.length) {
      modelName = j.data[0].id;
      document.getElementById("modelName").textContent = modelName;
    }
  })
  .catch(() => {});
const THINK_START = "<" + "think" + ">";
const THINK_END = "<" + "/think" + ">";

function bubble(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.innerHTML = `<div class="who">${role === "user" ? "You" : "Model"}</div>`;
  const body = document.createElement("div");
  body.textContent = text;
  d.appendChild(body);
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return body;
}

async function send() {
  const q = input.value.trim();
  if (!q || btn.disabled) return;
  input.value = "";
  bubble("user", q);
  history.push({ role: "user", content: q });
  if (history.length > 24) history = history.slice(-24);

  btn.disabled = true;
  const body = bubble("ai", "");
  body.classList.add("typing", "thinking");
  const t0 = performance.now();
  let n = 0, seen = false;

  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: modelName,
        messages: history,
        stream: true,
        max_tokens: 2048,
        temperature: 0.7,
        top_p: 0.8,
      }),
    });
    if (!res.ok) throw new Error(await res.text());
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "", text = "", answer = "", finish = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const data = line.slice(6).trim();
        if (data === "[DONE]") continue;
        try {
          const j = JSON.parse(data);
          if (j.choices?.[0]?.finish_reason) finish = j.choices[0].finish_reason;
          const delta = j.choices?.[0]?.delta?.content || "";
          if (!delta) continue;
          text += delta; n += 1;

          const i = text.indexOf(THINK_END);
          if (!seen && i >= 0) { seen = true; }
          if (seen) {
            answer = text.slice(i + THINK_END.length).replace(/^\s+/, "");
            body.classList.remove("thinking");
            body.textContent = answer;
          }
          // while the model is still thinking: nothing visible except "Thinking..."

          chat.scrollTop = chat.scrollHeight;
          const t = (performance.now() - t0) / 1000;
          if (t > 1) speed.textContent = (n / t).toFixed(0) + " tok/s";
        } catch (e) {}
      }
    }

    body.classList.remove("thinking");
    if (seen) {
      body.textContent = answer || "(empty response)";
      history.push({ role: "assistant", content: text });
    } else if (finish === "length") {
      body.textContent = "(empty response)";
      if (history.length && history[history.length - 1].role === "assistant") history.pop();
    } else {
      // model answered without thinking
      body.textContent = text || "(empty response)";
      history.push({ role: "assistant", content: text });
    }
    if (history.length > 24) history = history.slice(-24);
  } catch (e) {
    body.classList.remove("thinking");
    body.textContent = "Server error: " + e.message +
      "\n\nMake sure the model server is running (SERVE.bat).";
  } finally {
    body.classList.remove("typing");
    btn.disabled = false;
    input.focus();
  }
}

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
</script>
</body>
</html>
