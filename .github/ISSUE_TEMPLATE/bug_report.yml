name: Bug report
description: Something is broken - installer, server, chat UI, or kernel
title: "Bug: [short description]"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before reporting, check the [troubleshooting table](https://github.com/sebastianmechno-sys/vllm-rocm-windows-rdna2/blob/main/README.md#troubleshooting).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Describe the failure. Paste the exact error text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU model + VRAM
      placeholder: AMD Radeon RX 6750 XT, 12 GB
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
    validations:
      required: true
  - type: input
    id: step
    attributes:
      label: Which step fails
      description: INSTALL.bat (which step 1/6-6/6?), CHAT.bat, SERVE.bat, VERIFY.bat (1/3-3/3?)
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Paste the console output, or attach C:\_release_staging\setup_transcript.log
      render: text
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Exact command(s) run, e.g. INSTALL.bat -Model owner/model